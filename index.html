<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EUC Thrills</title>
    <meta name="description" content="An open-source arcade riding game about electric unicycles. One wheel. Total freedom. Ride anywhere." />
    <meta name="color-scheme" content="dark" />

    <!--
      Added to the home screen, this opens as a game rather than as a tab.

      The manifest is what iOS 16.4+ and Android read for the name, the icon,
      and `display: standalone`; the four `apple-` lines below are the older
      iOS route, kept because a handset that has not been updated is exactly
      the handset somebody rides this on. `black-translucent` puts the page
      under the status bar, which is only safe because the viewport is already
      `viewport-fit=cover` and every HUD lane and menu in `game.css` is padded
      by `env(safe-area-inset-*)` — remove either and the speed readout goes
      under the notch.

      There is no service worker, so this is an installed launcher and not an
      offline game: it still fetches the build each time it opens. That is a
      deliberate omission rather than an oversight — a cache needs a version
      and an update path, and neither exists yet.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EUC Thrills" />

    <!--
      Critical boot styles are inline on purpose. The loading shell has to be
      painted before any JavaScript runs, so the player never sees a white or
      blank page.

      The game's own UI is in a linked stylesheet, as this comment has promised
      since M0. Linked rather than imported from TypeScript so that no module
      under `src/` imports a `.css` file — every one of them has to stay
      runnable under Node's own test runner with no build step (master §19.1),
      and a stray CSS import is the one thing that would quietly end that.
    -->
    <style>
      :root {
        --ink: #eef2f7;
        --ink-dim: #97a3b4;
        --backdrop: #0d1014;
        --accent: #1f6fe0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--backdrop);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      /* Scoped to the play surface. A document-wide touch-action would also
         cover the menus, and menus are where a tap must keep behaving as a
         tap. */
      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.2rem;
        z-index: 10000;
        overflow: auto;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        text-align: center;
        background:
          radial-gradient(120% 90% at 50% 0%, #16202c 0%, var(--backdrop) 70%);
        transition: opacity 160ms ease;
      }

      #boot[hidden] { display: none; }
      #boot.is-dismissed { opacity: 0; pointer-events: none; }

      #boot .boot-wheel {
        width: 4rem; height: 4rem; border: 3px solid #2c3d52;
        border-top-color: var(--accent); border-radius: 50%;
        box-shadow: inset 0 0 0 0.65rem var(--backdrop), inset 0 0 0 0.8rem #2c3d52;
        animation: boot-turn 1.6s linear infinite;
      }
      @keyframes boot-turn { to { transform: rotate(360deg); } }

      #boot h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.75rem);
        font-weight: 800;
        letter-spacing: 0.14em;
        line-height: 1;
      }

      #boot h1 .accent { color: var(--accent); }

      #boot p {
        margin: 0;
        max-width: 34ch;
        color: var(--ink-dim);
        font-size: clamp(0.9rem, 2.6vw, 1.05rem);
        line-height: 1.5;
      }

      #boot #boot-heading { color: var(--ink); font-weight: 650; font-size: 1.1rem; }
      #boot #boot-count { font-size: 0.75rem; }
      #boot-retry {
        min-height: 2.75rem; padding: 0.65rem 1.4rem; border: 1px solid #4c91f4;
        border-radius: 0.5rem; background: var(--accent); color: #fff;
        font: inherit; font-weight: 650; cursor: pointer;
      }
      #boot-retry:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
      #boot-retry[hidden] { display: none; }
      @media (max-height: 28rem) {
        #boot { gap: 0.65rem; padding: 1rem; }
        #boot .boot-wheel { width: 2.25rem; height: 2.25rem; }
        #boot h1 { font-size: 2rem; }
      }

      #boot-track {
        width: min(18rem, 70vw);
        height: 3px;
        border-radius: 999px;
        background: #232c38;
        overflow: hidden;
      }

      #boot-bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        animation: boot-sweep 1.15s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }

      /* Respect the OS setting even before the in-game option exists. */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-wheel { animation: none; }
        #boot-bar { animation: none; width: 100%; opacity: 0.55; }
        #boot { transition: none; }
      }

      #boot-status {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }

      #boot-error {
        max-width: 46ch;
        padding: 1rem 1.25rem;
        border: 1px solid #7a2530;
        border-radius: 0.5rem;
        background: #1c1113;
        color: #ffc9cf;
        font-size: 0.9rem;
        line-height: 1.5;
        text-align: left;
        white-space: pre-wrap;
      }

      #boot-error[hidden] { display: none; }
    </style>
    <!-- Nonblocking until the tiny boot entry confirms this required sheet. -->
    <link id="game-styles" rel="stylesheet" href="/src/ui/game.css" media="print"
      onload="this.dataset.loaded='true'" onerror="this.dataset.failed='true'" />
  </head>

  <body>
    <canvas id="viewport"></canvas>

    <div id="boot" data-kind="boot" aria-busy="true" aria-label="Game loading">
      <div class="boot-wheel" aria-hidden="true"></div>
      <h1>EUC&nbsp;<span class="accent">THRILLS</span></h1>
      <p id="boot-heading">Your next ride awaits</p>
      <p id="boot-detail">One wheel. Total freedom. Ride anywhere.</p>
      <div id="boot-track"><div id="boot-bar"></div></div>
      <p id="boot-status" role="status" aria-live="polite">Loading the game</p>
      <p id="boot-count">Preparing your ride</p>
      <!-- role="alert" makes a fatal boot failure announce itself to
           assistive tech instead of leaving a silent stuck loading screen. -->
      <p id="boot-error" role="alert" hidden></p>
      <button id="boot-retry" type="button" hidden>Retry loading</button>
    </div>

    <script>
      // If even the tiny entry cannot download, the static shell still offers
      // recovery. Its owner hands off and removes this listener on boot.
      (() => {
        const remove = () => {
          window.removeEventListener('error', failed, true);
          window.removeEventListener('pagehide', remove);
          document.removeEventListener('euc-loader-ready', remove);
        };
        const failed = event => {
          if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
          const error = document.getElementById('boot-error');
          const retry = document.getElementById('boot-retry');
          error.textContent = 'The game could not download. Check your connection and try again.';
          error.hidden = false;
          retry.hidden = false;
          retry.onclick = () => window.location.reload();
          document.getElementById('boot-track').hidden = true;
          document.getElementById('boot-status').textContent = 'Could not finish loading';
          document.getElementById('boot-count').textContent = '';
          document.getElementById('boot').setAttribute('aria-busy', 'false');
          retry.focus();
          console.error('Required game entry failed:', event.target.src);
          remove();
        };
        window.addEventListener('error', failed, true);
        window.addEventListener('pagehide', remove, { once: true });
        document.addEventListener('euc-loader-ready', remove, { once: true });
      })();
    </script>
    <script type="module" src="/src/app/boot.ts"></script>
  </body>
</html>
